name: Deploy 규로마 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run engine tests
        run: npm test

      - name: Build 규로마 (the copy for everyone)
        run: npm run build:dist --workspace rodin-pipeline

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: rodin-pipeline/dist-public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
